[workspace]
members = ["crates/core", "crates/tui"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
zingolib-tui-core = { path = "crates/core" }

# The shielded-voting feature branch of zingolib; swap to a rev pin (or
# main) once the branch lands.
zingolib = { git = "https://github.com/zingolabs/zingolib", branch = "feat/lightclient-voting-api", features = [
    "perspective",
] }
zingolib-voting = { git = "https://github.com/zingolabs/zingolib", branch = "feat/lightclient-voting-api" }
pepper-sync = { git = "https://github.com/zingolabs/zingolib", branch = "feat/lightclient-voting-api" }
zingo-netutils = { git = "https://github.com/zingolabs/zingolib", branch = "feat/lightclient-voting-api" }
zingo-status = { git = "https://github.com/zingolabs/zingolib", branch = "feat/lightclient-voting-api" }

bip0039 = { version = "0.14", features = ["rand"] }
zip32 = "0.3"
zip321 = "0.10"
zcash_protocol = "=0.11.0"
zcash_address = "=0.14.0"

ratatui = "0.30"
crossterm = "0.29"
qrcode = { version = "0.14", default-features = false }

clap = { version = "4", features = ["derive"] }
chrono = "0.4"
dirs = "6"
http = "1"
rustls = { version = "0.23", features = ["ring"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[patch.crates-io]
# The voting SDK's current lrz build path: branch of the zingolabs fork
# until a release lands on crates.io.
zcash_voting = { git = "https://github.com/zingolabs/zcash_voting", branch = "feat/lrz-librustzcash-0-31-port" }

[profile.test]
opt-level = 3
