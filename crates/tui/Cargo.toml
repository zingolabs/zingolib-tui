[package]
name = "zingolib-tui"
description = "Terminal wallet for Zcash mainnet, built on zingolib"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zingolib-tui"
path = "src/main.rs"

[dependencies]
zingolib-tui-core = { workspace = true }
zingolib = { workspace = true }
zingo-netutils = { workspace = true }
pepper-sync = { workspace = true }
zingo-status = { workspace = true }
zcash_protocol = { workspace = true }
bip0039 = { workspace = true }

ratatui = { workspace = true }
crossterm = { workspace = true }
qrcode = { workspace = true }

clap = { workspace = true }
chrono = { workspace = true }
http = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
